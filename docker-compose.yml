services:
  postgres:
    image: postgres:16-alpine
    container_name: lawauto-postgres
    environment:
      POSTGRES_DB: law_auto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d law_auto"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawauto-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/law_auto
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_JWT_SECRET: replace-this-with-at-least-32-characters-secret-key
      APP_JWT_EXPIRATION_MINUTES: 240
    ports:
      - "8080:8080"

volumes:
  postgres_data:
