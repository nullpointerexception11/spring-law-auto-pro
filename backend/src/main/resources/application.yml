spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/law_auto}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:replace-this-with-at-least-32-characters-secret-key}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:240}
    refresh-expiration-days: ${APP_JWT_REFRESH_EXPIRATION_DAYS:14}
  exports:
    root: ${APP_EXPORTS_ROOT:C:/tmp/law-auto-exports}
