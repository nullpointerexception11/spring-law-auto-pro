spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY: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}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/law_auto}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: false
        globally_quoted_identifiers: true
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"

app:
  jwt:
    secret: ${APP_JWT_SECRET:replace-this-with-at-least-32-characters-secret-key}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:240}
    refresh-expiration-days: ${APP_JWT_REFRESH_EXPIRATION_DAYS:14}
  exports:
    root: ${APP_EXPORTS_ROOT:C:/tmp/law-auto-exports}
  storage:
    provider: ${APP_STORAGE_PROVIDER:LOCAL}
    local:
      path: ${APP_STORAGE_LOCAL_PATH:./storage}

